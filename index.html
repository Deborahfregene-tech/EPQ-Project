<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyCool | A-Level Literature</title>

    <!-- Google Fonts Import -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Lora:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="logo-container">
        <h1 class="heading">StudyCool</h1>
        <img
          src="https://i.ibb.co/DfLtyLzk/Red-Black-Typography-Nine-Brand-Logo.png"
          alt="Red Black Typography Nine Brand Logo"
          border="0"
          alt="StudyCool Logo"
          class="header-logo"
        />
      </div>
      <p class="slogan">Studying makes you Cooler !</p>
    </header>

    <p class="gen-ui-ask">Ask Ms. Study Anything !</p>

      <button class="generate" type="submit">Generate</button>
    </div>

    <div id="gen-ui-output"></div>

    <section class="selection-section">
      <h2>What would you like to revise ?</h2>

      <div class="text-grid">
        <a href="#macbeth" class="text-card">Macbeth</a>
        <a href="#merchant-of-venice" class="text-card">Merchant of Venice</a>
        <a href="#christmas-carol" class="text-card">A Christmas Carol</a>
        <a href="#frankenstein" class="text-card">Frankenstein</a>
        <a href="#animal-farm" class="text-card">Animal Farm</a>
        <a href="#inspector-calls" class="text-card">An Inspector Calls</a>
      </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
